- slug: fremantle
  name: Fremantle
  authority: City of Fremantle
  coverage: >-
    The council’s 2021 GIS layer supplies individual bay pins. Its CBD map supplies approximate pins for symbols with no nearby match in that layer. One symbol may cover several bays.
    The OpenStreetMap extract retrieved on 27 November 2026 adds 11 locations in areas away from existing pins.
