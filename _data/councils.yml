- slug: perth
  name: Perth
  authority: City of Perth
  coverage: >-
    The council’s on-street locations use deduplicated bay polygons, including two designated for pick-up or set-down only. Its car park pins show the facility location. Each car park may contain multiple bays.
    The OpenStreetMap extract retrieved on 27 November 2026 adds 21 locations in areas away from existing pins.
  links:
