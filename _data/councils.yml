- slug: cockburn
  name: Cockburn
  authority: City of Cockburn
  coverage: >-
    The Perth OpenStreetMap extract retrieved on 27 November 2026 supplied 35 locations with partial coverage.
    It includes 17 individual bays, nine approximate locations for groups of bays or street-side parking, and nine car parks.
    Car park counts come from OpenStreetMap and pins show the facility location. The customer-only location is labelled in its record.
    The snapshot uses nodes and ways inside the ABS Cockburn boundary. It excludes a duplicate car park,
    a car park with a capacity warning and private venues without clear visitor access.
  links:
    - label: © OpenStreetMap contributors
      url: https://www.openstreetmap.org/copyright
    - label: ODbL 1.0
      url: https://opendatacommons.org/licenses/odbl/1-0/
